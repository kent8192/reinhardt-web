[package]
name = "reinhardt-formatter"
version = "0.4.0-alpha.15"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Formatter for Reinhardt page!, form!, head!, and style! DSL macros"
publish = true

[features]
testing = ["dep:reinhardt-manouche"]

[dependencies]
reinhardt-manouche = { workspace = true, optional = true }
clap = { version = "4.5", features = ["derive"] }
colored = { workspace = true }
regex = "1.10"
tree-sitter = "0.26"
tree-sitter-rust = "0.24.2"
tree-sitter-reinhardt-page = { workspace = true }
tree-sitter-reinhardt-form = { workspace = true }
tree-sitter-reinhardt-head = { workspace = true }
tree-sitter-reinhardt-style = { workspace = true }
topiary-core = { workspace = true }
topiary-tree-sitter-facade = { workspace = true }
walkdir = "2.5"
zeroize = "1.8"

[dev-dependencies]
syn = { workspace = true, features = ["full", "visit"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
rstest = { workspace = true }
tempfile = "3.8"

[[bin]]
name = "reinhardt-formatter"
path = "src/main.rs"
