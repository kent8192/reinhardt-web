name: PR 6372 stage verified source
on:
  push:
    branches: [feature/issue-6355-oauth-authorization-server]
    paths: [.github/workflows/pr-6372-stage-verified.yml]
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-6372-concurrency-evidence
          run-id: 36072356148
          github-token: ${{ github.token }}
          path: input
      - name: Stage independently verified source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, tarfile, urllib.request
          archive = pathlib.Path('input/auth-source.tar.gz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'a9c34c5fca93a9c8264d6ce179e61f6e252d8c151cde9819e9dec0011e4eb90c'
          paths = ['README.md', 'src/oauth2_server.rs', 'src/oauth2_server/http.rs', 'src/oauth2_server/postgres.rs', 'src/oauth2_server/protocol.rs', 'src/oauth2_server/store.rs', 'src/oauth2_server/tests.rs', 'src/oauth2_server/tests/review_tests.rs', 'src/oidc_op/postgres.rs', 'src/oidc_op/protocol.rs', 'src/oidc_op/store.rs', 'src/oidc_op/tests.rs', 'src/oidc_op/tests/review_tests.rs']
          result = {}
          with tarfile.open(archive) as tar:
              for suffix in paths:
                  path = 'crates/reinhardt-auth/' + suffix
                  entry = tar.getmember(path)
                  assert entry.isfile() and entry.size < 200000
                  data = tar.extractfile(entry).read()
                  sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  request = urllib.request.Request('https://api.github.com/repos/kent8192/reinhardt-web/git/blobs', data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Content-Type': 'application/json', 'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert json.load(response)['sha'] == sha
                  result[path] = sha
          pathlib.Path('staged.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr-6372-staged-source
          path: staged.json
          retention-days: 1
