name: PR 6372 final source verification

on:
  push:
    branches: [feature/issue-6355-oauth-authorization-server]
    paths: [.github/workflows/pr-6372-final-source-verification.yml]

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SOURCE_SHA256: a9c34c5fca93a9c8264d6ce179e61f6e252d8c151cde9819e9dec0011e4eb90c
  APPROVED_BLOBS: >-
    {"crates/reinhardt-auth/README.md":"e417455e643de614899b18add17e9ade4b74694c","crates/reinhardt-auth/src/oauth2_server.rs":"b2cbf2f6e34da5077764420a06e1f4cd67f9ff9d","crates/reinhardt-auth/src/oauth2_server/http.rs":"38ad6ef5b0336e05ecd566ad68a6365e36303b4a","crates/reinhardt-auth/src/oauth2_server/postgres.rs":"38e8e9d9370ce3b87995975f61175dab4f1f6791","crates/reinhardt-auth/src/oauth2_server/protocol.rs":"33af622f4247f02974bd7c6db083d0b73fbce6d2","crates/reinhardt-auth/src/oauth2_server/store.rs":"5f8c8c25d645e9346aa9f6845ada8e60c4f3b239","crates/reinhardt-auth/src/oauth2_server/tests.rs":"07dd13f31f5695c62c919adbe5bd5e23f1dffdd1","crates/reinhardt-auth/src/oauth2_server/tests/review_tests.rs":"3ea1ef078ddefe97fa1561448faf97f36c2620c4","crates/reinhardt-auth/src/oidc_op/postgres.rs":"d22d1c48c2bd9b2795ce270ec8c2784faded8b28","crates/reinhardt-auth/src/oidc_op/protocol.rs":"459d272921b7175f0a8b82cd7f6e3d410e9387cb","crates/reinhardt-auth/src/oidc_op/store.rs":"9372efb1978663ac812a0c4db42689a3e822baa6","crates/reinhardt-auth/src/oidc_op/tests.rs":"e07429fab0fc7fdc587aeba39cd7609e72ff2d0b","crates/reinhardt-auth/src/oidc_op/tests/review_tests.rs":"d931f8a587bc26fc2c68a72a9a4b6836d8f87bf2"}

jobs:
  verify:
    if: github.repository == 'kent8192/reinhardt-web'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pr-6372-concurrency-evidence
          run-id: 36072356148
          github-token: ${{ github.token }}
          path: /tmp/pr-6372-verified-input
      - name: Install only the checksum-pinned reviewed auth source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:crates/reinhardt-auth)" = 8c20a74776ce17681a9f397a18c611d2d1b06519
          python3 - <<'PY'
          import hashlib, json, os, pathlib, tarfile
          archive = pathlib.Path('/tmp/pr-6372-verified-input/auth-source.tar.gz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['SOURCE_SHA256']
          expected = json.loads(os.environ['APPROVED_BLOBS'])
          with tarfile.open(archive) as tar:
              for path, sha in expected.items():
                  member = tar.getmember(path)
                  assert member.isfile() and member.size < 200000
                  data = tar.extractfile(member).read()
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
                  target = pathlib.Path(path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          PY
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-6372-auth-review
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
      - name: Lint the affected production crate with its host database backend
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-6372-final-evidence
          cargo clippy -p reinhardt-auth --features oidc-op,database,reinhardt-db/postgres --lib --no-deps -- -D warnings 2>&1 | tee /tmp/pr-6372-final-evidence/clippy.log
      - name: Verify affected documentation and formatting
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-6372-final-evidence
          RUSTDOCFLAGS='-D warnings' cargo doc -p reinhardt-auth --features oidc-op,database,reinhardt-db/postgres --no-deps 2>&1 | tee /tmp/pr-6372-final-evidence/rustdoc.log
          cargo test -p reinhardt-auth --features oidc-op,database --doc oauth2_server 2>&1 | tee /tmp/pr-6372-final-evidence/oauth-doctests.log
          cargo test -p reinhardt-auth --features oidc-op,database --doc oidc_op 2>&1 | tee /tmp/pr-6372-final-evidence/oidc-doctests.log
          cargo fmt -p reinhardt-auth --check
          git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-6372-final-verification
          path: /tmp/pr-6372-final-evidence/
          retention-days: 1
  stage-reviewed-blobs:
    needs: verify
    if: github.repository == 'kent8192/reinhardt-web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-6372-concurrency-evidence
          run-id: 36072356148
          github-token: ${{ github.token }}
          path: /tmp/pr-6372-verified-input
      - name: Stage only approved unattached blobs without publishing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, tarfile, urllib.request
          archive = pathlib.Path('/tmp/pr-6372-verified-input/auth-source.tar.gz')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['SOURCE_SHA256']
          expected = json.loads(os.environ['APPROVED_BLOBS'])
          staged = {}
          with tarfile.open(archive) as tar:
              for path, sha in expected.items():
                  assert path.startswith('crates/reinhardt-auth/') and '..' not in pathlib.PurePosixPath(path).parts
                  member = tar.getmember(path)
                  assert member.isfile() and member.size < 200000
                  data = tar.extractfile(member).read()
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == sha
                  payload = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
                  request = urllib.request.Request('https://api.github.com/repos/kent8192/reinhardt-web/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      result = json.load(response)
                  assert result['sha'] == sha
                  staged[path] = sha
          pathlib.Path('/tmp/pr-6372-staged-blobs.json').write_text(json.dumps(staged, indent=2))
          print(json.dumps(staged, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pr-6372-staged-blobs
          path: /tmp/pr-6372-staged-blobs.json
          retention-days: 1
