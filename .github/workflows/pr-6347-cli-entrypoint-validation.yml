name: PR 6347 CLI entrypoint validation

on:
  push:
    branches: [fix/pr-6347-cli-entrypoint-validation]
    paths: [.github/workflows/pr-6347-cli-entrypoint-validation.yml]

permissions:
  contents: write

jobs:
  validate:
    if: >-
      github.repository == 'kent8192/reinhardt-web' && github.event.head_commit.message == 'ci: validate PR 6347 management entrypoint'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_TERM_COLOR: never
      BASE_SHA: 2521df26a050f14848188c1c1a34458fb912e560
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2521df26a050f14848188c1c1a34458fb912e560
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
      - name: Recover the narrow candidate and prepare regression tests
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = 'crates/reinhardt-commands/src/cli.rs';
            const original = fs.readFileSync(path);
            const hash = crypto.createHash('sha1').update(`blob ${original.length}\0`).update(original).digest('hex');
            if (hash !== '977dd9db3504213226a6a444df84ade2e53c810f') throw new Error('unexpected CLI base');
            const {data: blob} = await github.rest.git.getBlob({owner:'kent8192', repo:'reinhardt-web', file_sha:'5c68d3403db6dc19b9632f46583dc5a40b13fc68'});
            let candidate = Buffer.from(blob.content, 'base64').toString('utf8');
            const marker = '#[cfg(test)]\nmod tests {\n';
            candidate = candidate.replace(marker + '\n', marker);
            const anchor = '\t\tassert_eq!(asset_mode, "development");\n';
            if (candidate.split(anchor).length !== 2) throw new Error('unexpected existing asset options test');
            candidate = candidate.replace(anchor, anchor + '\t\tassert!(asset_entrypoint.is_none());\n');
            const begin = candidate.indexOf(marker) + marker.length;
            const end = candidate.indexOf('\t#[rstest::rstest]\n\tfn buildstatic_driver_', begin);
            if (begin < marker.length || end <= begin) throw new Error('regression test boundaries missing');
            const tests = candidate.slice(begin, end);
            fs.mkdirSync('/tmp/pr6347-evidence', {recursive:true});
            fs.writeFileSync('/tmp/pr6347-evidence/candidate.rs', candidate);
            fs.writeFileSync(path, original.toString('utf8').replace(marker, marker + tests));
      - name: Resolve the untracked workspace lockfile once
        run: |
          cargo generate-lockfile
          cp Cargo.lock /tmp/pr6347-evidence/Cargo.lock
      - name: Reproduce the missing CLI selector
        id: red
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo test --locked -p reinhardt-commands --features migrations --lib cli::tests::runserver_asset_entrypoint -- --nocapture 2>&1 | tee /tmp/pr6347-evidence/red.log
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" -ne 0 ] && grep -q 'management entrypoint selector should parse' /tmp/pr6347-evidence/red.log && grep -q 'test result: FAILED' /tmp/pr6347-evidence/red.log; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verified=false' >> "$GITHUB_OUTPUT"
            echo 'Baseline did not reach the expected regression assertion; inspect red.log.'
            exit 1
          fi
      - name: Apply and format the candidate
        run: |
          cp /tmp/pr6347-evidence/candidate.rs crates/reinhardt-commands/src/cli.rs
          rustfmt --edition 2024 crates/reinhardt-commands/src/cli.rs
          rustfmt --edition 2024 --check crates/reinhardt-commands/src/cli.rs
          git diff --check
          git diff --stat
          git diff -- crates/reinhardt-commands/src/cli.rs | tee /tmp/pr6347-evidence/change.patch
          cp crates/reinhardt-commands/src/cli.rs /tmp/pr6347-evidence/cli.rs
      - name: Store the candidate tree without updating a branch
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const owner = 'kent8192', repo = 'reinhardt-web';
            const parent = process.env.BASE_SHA;
            const path = 'crates/reinhardt-commands/src/cli.rs';
            const { data: commit } = await github.rest.git.getCommit({owner, repo, commit_sha: parent});
            const { data: blob } = await github.rest.git.createBlob({owner, repo, content: fs.readFileSync(path, 'utf8'), encoding: 'utf-8'});
            const { data: tree } = await github.rest.git.createTree({owner, repo, base_tree: commit.tree.sha, tree: [{path, mode: '100644', type: 'blob', sha: blob.sha}]});
            const result = {parent, tree: tree.sha, blob: blob.sha, path};
            fs.writeFileSync('/tmp/pr6347-evidence/candidate.json', JSON.stringify(result, null, 2));
            core.notice(JSON.stringify(result));
      - name: Run all management CLI component tests
        id: green
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p reinhardt-commands --features migrations --lib cli::tests:: -- --nocapture 2>&1 | tee /tmp/pr6347-evidence/green.log
      - name: Check the affected crate and standalone consumer
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --locked -p reinhardt-commands --features migrations 2>&1 | tee /tmp/pr6347-evidence/check.log
      - name: Lint the affected library
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -p reinhardt-commands --features migrations --lib -- -D warnings 2>&1 | tee /tmp/pr6347-evidence/clippy.log
      - name: Summarize validation
        if: always()
        env:
          RED: ${{ steps.red.outputs.verified }}
          GREEN: ${{ steps.green.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: |
          mkdir -p /tmp/pr6347-evidence
          printf 'Expected regression failure verified: %s\nCLI component tests: %s\nAffected build check: %s\nScoped Clippy: %s\n' "$RED" "$GREEN" "$CHECK" "$CLIPPY" | tee /tmp/pr6347-evidence/results.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr6347-cli-entrypoint-evidence
          path: /tmp/pr6347-evidence
          retention-days: 7
      - name: Enforce the validation result
        if: always()
        env:
          RED: ${{ steps.red.outputs.verified }}
          GREEN: ${{ steps.green.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
        run: test "$RED" = true && test "$GREEN" = success && test "$CHECK" = success && test "$CLIPPY" = success
