name: PR 6372 independent concurrency verification

on:
  push:
    branches: [feature/issue-6355-oauth-authorization-server]
    paths: [.github/workflows/pr-6372-concurrency-verification.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  concurrency:
    if: github.repository == 'kent8192/reinhardt-web'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply both reviewed patches and independent race regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:crates/reinhardt-auth)" = 8c20a74776ce17681a9f397a18c611d2d1b06519
          mkdir -p /tmp/pr-6372-concurrency
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, re, subprocess, urllib.request
          def blob(sha):
              request = urllib.request.Request('https://api.github.com/repos/kent8192/reinhardt-web/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return base64.b64decode(json.load(response)['content'])
          initial = ['8c321e7884ea1ba1da30f05bd226ba1877f143a6', '74bf8cd7b0d9c5496c29b2f3f23e7f501082c0d2', '472e220b1f1202d896b68456d1d303d77ea9b96b']
          patch = gzip.decompress(b''.join(map(blob, initial)))
          assert hashlib.sha256(patch).hexdigest() == '53ef449f71fdd4c2541c36b6b90a6a53f7fba3d001fa3de3bd26af6fe3eb6f4a'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          followups = ['a7ca42f388f046f10694dbc0b6f59994c7c9c833', 'e8fab293d9f818275a8befebbf448103d0c14027', '1560a3f6c59fc9a64e4409c9ece6702d70f1fc6e', '774ebcfc6cc07be5fdef03d64435f4273f3c4ca2']
          patch = gzip.decompress(base64.b64decode(b''.join(map(blob, followups)), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '486d1581080c75f0e7cc5117ea1e4c4062b5014d25a1a20298c5d7544dacf7b9'
          pathlib.Path('/tmp/pr-6372-concurrency/followups.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          # Reuse the exact four independently passing tests without executing the old workflow.
          previous = blob('7202aa47b20b9bb01a1eaf09cac9b9df87628919').decode()
          path = pathlib.Path('crates/reinhardt-auth/src/oidc_op/tests/review_tests.rs')
          source = path.read_text()
          for name, anchor in [('outer', '#[cfg(feature = "database")]\nmod postgres {'), ('inner', '\tstruct CloseOnceUsers {')]:
              tests = re.search(name + r" = r'''(.*?)'''", previous, re.S).group(1)
              assert source.count(anchor) == 1
              source = source.replace(anchor, tests + '\n' + anchor)
          path.write_text(source)
          subprocess.run(['git', 'add', '-N', 'crates/reinhardt-auth/src/oauth2_server/tests/review_tests.rs', str(path)], check=True)
          PY
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-6372-auth-review
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
      - name: Verify all review and deterministic race regressions
        run: |
          set -euo pipefail
          cargo fmt -p reinhardt-auth
          git diff --check
          cargo test -p reinhardt-auth --no-default-features --features oidc-op,database --lib review_tests -- --test-threads=2 2>&1 | tee /tmp/pr-6372-concurrency/regressions.log
      - name: Verify complete affected suites
        run: |
          set -euo pipefail
          cargo test -p reinhardt-auth --no-default-features --features oidc-op,database --lib oauth2_server::tests -- --test-threads=2 2>&1 | tee /tmp/pr-6372-concurrency/oauth-tests.log
          cargo test -p reinhardt-auth --no-default-features --features oidc-op,database --lib oidc_op::tests -- --test-threads=2 2>&1 | tee /tmp/pr-6372-concurrency/oidc-tests.log
      - name: Verify isolated feature configurations and production lint
        run: |
          set -euo pipefail
          for features in oauth oauth,database oidc-op oidc-op,database; do
            cargo check -p reinhardt-auth --no-default-features --features "$features" 2>&1 | tee "/tmp/pr-6372-concurrency/check-${features//,/-}.log"
          done
          cargo clippy -p reinhardt-auth --features oidc-op,database --lib -- -D warnings 2>&1 | tee /tmp/pr-6372-concurrency/clippy-lib.log
      - name: Verify affected documentation and final formatting
        run: |
          set -euo pipefail
          RUSTDOCFLAGS='-D warnings' cargo doc -p reinhardt-auth --features oidc-op,database --no-deps 2>&1 | tee /tmp/pr-6372-concurrency/rustdoc.log
          cargo test -p reinhardt-auth --features oidc-op,database --doc oauth2_server 2>&1 | tee /tmp/pr-6372-concurrency/oauth-doctests.log
          cargo test -p reinhardt-auth --features oidc-op,database --doc oidc_op 2>&1 | tee /tmp/pr-6372-concurrency/oidc-doctests.log
          cargo fmt -p reinhardt-auth --check
      - name: Package inspected source and evidence
        if: always()
        run: |
          mkdir -p /tmp/pr-6372-concurrency
          git diff --binary -- crates/reinhardt-auth > /tmp/pr-6372-concurrency/source.patch
          tar -czf /tmp/pr-6372-concurrency/auth-source.tar.gz crates/reinhardt-auth
          git rev-parse HEAD > /tmp/pr-6372-concurrency/checkout.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-6372-concurrency-evidence
          path: /tmp/pr-6372-concurrency/
          retention-days: 1
