name: Security Audit

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label JSON'
        type: string
        default: '"ubuntu-latest"'
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    name: Check dependency policy
    runs-on: ${{ fromJSON(inputs.runner || '"ubuntu-latest"') }}
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9

      - name: Run cargo deny
        run: cargo deny --workspace --all-features check all

  # Scheduled runs check out only the default branch, so main and the newest
  # develop branch are listed explicitly; older develop branches are inactive.
  # Stale-entry lints stay out of pull requests so an upstream release cannot
  # block unrelated work.
  list-policy-branches:
    name: List policy branches
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.workflow == 'Security Audit')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - name: List main and the newest develop branch
        id: list
        run: |
          branches=$(
            {
              echo main
              git ls-remote --heads "https://github.com/${GITHUB_REPOSITORY}" 'refs/heads/develop/*' \
                | sed 's#.*refs/heads/##' \
                | sort -V \
                | tail -n 1
            } | jq -R . | jq -cs .
          )
          echo "branches=${branches}" >> "$GITHUB_OUTPUT"

  stale-policy-entries:
    name: Detect stale policy entries (${{ matrix.branch }})
    needs: list-policy-branches
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.list-policy-branches.outputs.branches) }}
    steps:
      - name: Checkout policy branch
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9

      - name: Fail on exceptions and allowances that no longer match
        run: >-
          cargo deny --workspace --all-features check
          --deny advisory-not-detected
          --deny unmatched-skip
          --deny unnecessary-skip
          advisories bans
