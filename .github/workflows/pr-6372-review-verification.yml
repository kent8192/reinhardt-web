name: PR 6372 review verification

on:
  push:
    branches: [feature/issue-6355-oauth-authorization-server]
    paths: [.github/workflows/pr-6372-review-verification.yml]

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  regressions:
    if: github.repository == 'kent8192/reinhardt-web'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the original auth source tree
        run: test "$(git rev-parse HEAD:crates/reinhardt-auth)" = 8c20a74776ce17681a9f397a18c611d2d1b06519
      - name: Add regression tests without changing production code
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, re, subprocess
          source = subprocess.check_output(['git', 'show', '8b405e9df59fc36146b5e37839843206dceed197:.github/workflows/pr-6372-review-verification.yml'], text=True)
          encoded = re.search(r'^\s+PATCH_GZIP_BASE64: (\S+)$', source, re.M).group(1)
          encoded = encoded.replace('f6r6pVf', 'f6rKpVf')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '7acbdcdae6cbe9d1ab7240e5791af39b6e3100d1f53eb86a38d0a5d8094930ed'
          path = pathlib.Path('/tmp/pr-6372-baseline.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          PY
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pr-6372-auth-review
      - uses: arduino/setup-protoc@v3
        with:
          version: '28.x'
      - name: Reproduce failing assertions on the original implementation
        run: |
          cargo fmt -p reinhardt-auth
          set +e
          cargo test -p reinhardt-auth --no-default-features --features oidc-op,database --lib review_tests -- --test-threads=2 2>&1 | tee /tmp/pr-6372-baseline.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -q 'test result: FAILED' /tmp/pr-6372-baseline.log
      - name: Package test evidence
        if: always()
        run: |
          git diff --check
          tar -czf /tmp/pr-6372-baseline-source.tar.gz crates/reinhardt-auth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-6372-baseline-evidence
          path: |
            /tmp/pr-6372-baseline.log
            /tmp/pr-6372-baseline-source.tar.gz
          retention-days: 1
